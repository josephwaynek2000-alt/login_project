<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>

    <style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(255, 214, 224, 0.9), transparent 35%),
        linear-gradient(135deg, #fff7fb, #ffeef5);
    color: #4b2e39;
    min-height: 100vh;
}

.page-shell {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.nav-left {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.nav-left a {
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.75);
    color: #7b4f60;
    font-weight: bold;
    border: 1px solid #f2cdd9;
    transition: all 0.2s ease;
}

.nav-left a:hover {
    background: linear-gradient(135deg, #4b0251, #d96c95);
    color: white;

}

.nav-left a.active {
    background: linear-gradient(135deg, #4b0251, #d96c95);
    color: white;
    box-shadow: 0 10px 20px rgba(217, 108, 149, 0.25);
}

.nav-left a {
    transition: all 0.2s ease;
}

.nav-right {
    margin-left: auto;
}

.logout-btn {
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, #f07da1, #d96c95);
    color: white;
    font-weight: bold;
    box-shadow: 0 10px 20px rgba(217, 108, 149, 0.25);
    transition: all 0.2s ease;
    display: inline-block;
}

.logout-btn:hover {
    transform: translateY(-1px);
}

.container {
    background: rgba(255, 255, 255, 0.82);
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    min-height: 500px;
}
/* Logout button styling */
        .logout-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, #f07da1, #d96c95);
            color: white;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(217, 108, 149, 0.25);
}

        .logout-btn:hover {
            transform: translateY(-1px);
}

        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

         .logout {
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #f07da1, #d96c95);
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: bold;
            box-shadow: 0 14px 28px rgba(217, 108, 149, 0.24);
        }

    </style>
</head>
<body>


    </style>
</head>
<body>
    <div class="page-shell">
        <div class="nav-bar">
            <div class="nav-left">
                <a href="/dashboard" class="{% if page is defined and page == 'dashboard' %}active{% endif %}">Home</a>
                <a href="/letters" class="{% if page is defined and page == 'letters' %}active{% endif %}">Letters</a>
                <a href="/memories" class="{% if page is defined and page == 'memories' %}active{% endif %}">Memories</a>
                <a href="/photos" class="{% if page is defined and page == 'photos' %}active{% endif %}">Photos</a>
            </div>

            <div class="nav-right">
                <a href="/logout" class="logout-btn">Log Out</a>
            </div>
        </div>

        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
